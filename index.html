<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4efe6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Chore Roster</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏠%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <p class="eyebrow">Chore Roster</p>
        <h1>HTP Boys</h1>
        <p class="subhead"></p>
      </div>
      <div class="header-actions">
        <div class="week-chip" id="weekChip">Loading week...</div>
      </div>
    </header>

    <div class="corner-toggle">
      <label class="theme-switch">
        <input type="checkbox" id="themeToggle" aria-label="Toggle dark mode" />
        <span class="switch-track" aria-hidden="true"></span>
        <span class="switch-label">
          <span class="switch-icon sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <line x1="12" y1="2" x2="12" y2="5"></line>
              <line x1="12" y1="19" x2="12" y2="22"></line>
              <line x1="2" y1="12" x2="5" y2="12"></line>
              <line x1="19" y1="12" x2="22" y2="12"></line>
              <line x1="4.9" y1="4.9" x2="7" y2="7"></line>
              <line x1="17" y1="17" x2="19.1" y2="19.1"></line>
              <line x1="4.9" y1="19.1" x2="7" y2="17"></line>
              <line x1="17" y1="7" x2="19.1" y2="4.9"></line>
            </svg>
          </span>
          <span class="switch-icon moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
              <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z"></path>
            </svg>
          </span>
        </span>
      </label>
    </div>

    <nav class="tabs" aria-label="Sections">
      <button
        class="tab-button is-active"
        id="tabChores"
        type="button"
        role="tab"
        aria-selected="true"
        aria-controls="panelChores"
        data-tab-target="panelChores"
      >
        Chores
      </button>
      <button
        class="tab-button"
        id="tabReminder"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="panelReminder"
        data-tab-target="panelReminder"
      >
        Add a reminder
      </button>
    </nav>

    <section class="tab-panel is-active" id="panelChores" role="tabpanel" aria-labelledby="tabChores" data-tab-panel>
      <section class="summary" aria-live="polite">
        <h2>This week</h2>
        <div class="summary-list" id="summaryList"></div>
        <button class="preview-button" id="previewButton" type="button">Preview next week</button>
        <p class="note" id="changeNote"></p>

        <div class="popover hidden" id="previewPopover" role="dialog" aria-modal="false" aria-labelledby="nextWeekTitle">
          <div class="popover-card">
            <div class="modal-header">
              <h3 id="nextWeekTitle">Next week</h3>
              <button class="modal-close" id="modalClose" type="button" aria-label="Close preview">Close</button>
            </div>
            <div class="summary-list" id="nextSummaryList"></div>
          </div>
        </div>
      </section>
    </section>

    <section class="tab-panel" id="panelReminder" role="tabpanel" aria-labelledby="tabReminder" data-tab-panel hidden>
      <section class="summary reminder-panel">
        <h2 data-reminder-animate>Create a reminder</h2>
        <form id="reminderForm" class="reminder-form" novalidate>
          <div class="sentence-builder" data-reminder-animate>
            <div class="sentence-line sentence-line-primary">
              <span class="sentence-token">Remind</span>
              <div class="inline-select-field sentence-slot flatmate-slot">
                <select id="reminderFlatmate" name="flatmate" aria-label="Flatmate" required></select>
              </div>
              <span class="sentence-token">about</span>
              <div class="inline-select-field sentence-slot chore-slot">
                <select id="reminderChore" name="chore" aria-label="Chore" required></select>
              </div>
            </div>
            <div class="sentence-line sentence-line-secondary">
              <span class="sentence-token">on</span>
              <div class="inline-select-field sentence-slot weekday-slot">
                <select id="reminderWeekday" name="weekday" aria-label="Reminder day of week" required>
                  <option value="Monday">Monday</option>
                  <option value="Tuesday">Tuesday</option>
                  <option value="Wednesday">Wednesday</option>
                  <option value="Thursday">Thursday</option>
                  <option value="Friday">Friday</option>
                  <option value="Saturday">Saturday</option>
                  <option value="Sunday">Sunday</option>
                </select>
              </div>
              <span class="sentence-token">at</span>
              <div class="inline-time-field sentence-slot time-slot">
                <input id="reminderTime" name="time" type="time" aria-label="Reminder time" required />
              </div>
            </div>
          </div>

          <label class="checkbox-field" data-reminder-animate>
            <input id="reminderEveryOccurrence" name="everyOccurrence" type="checkbox" />
            <span id="reminderEveryOccurrenceLabel">Remind on each occurence</span>
          </label>

          <button class="preview-button generate-button" id="generateReminderButton" type="submit" data-reminder-animate>Generate reminder</button>
        </form>

        <div class="popover reminder-popover hidden" id="reminderPopover" role="dialog" aria-modal="false" aria-labelledby="reminderPopoverTitle">
          <div class="popover-card reminder-popover-card">
            <div class="modal-header">
              <h3 id="reminderPopoverTitle">Reminder ready</h3>
              <button class="modal-close" id="reminderPopoverClose" type="button" aria-label="Close reminder actions">Close</button>
            </div>
            <p class="note reminder-result" id="reminderResult"></p>
            <div class="reminder-actions">
              <button class="preview-button action-button" id="addToCalendarButton" type="button">Add to calendar</button>
              <button class="icon-button" id="downloadIcsButton" type="button" aria-label="Download invite (.ics)" title="Download invite (.ics)">&#x2B07;</button>
            </div>
          </div>
        </div>

        <p class="note" id="reminderStatus" aria-live="polite"></p>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
